<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadMap — Popup</title>
    <script type="module" crossorigin src="/assets/popup-BTGh0nJg.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/index-BOGgeRgy.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CFSyVAAv.css">
  </head>
  <body class="bg-white">
    <div id="root"></div>
    <div style="padding:0 16px 14px; background:#fff; font-family:system-ui,sans-serif;">
      <button id="platformSyncBtn" style="width:100%; padding:9px 12px; background:#059669; color:#fff; border:none; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 2px 4px rgba(5,150,105,0.2);">
        <span>🚀 Push Leads to Unified Platform</span>
      </button>
      <div id="platformSyncMsg" style="margin-top:6px; font-size:11px; text-align:center; font-weight:600; color:#047857;"></div>
      <div style="margin-top:8px; display:flex; align-items:center; justify-content:space-between; font-size:10px; color:#6b7280; border-top:1px solid #f3f4f6; padding-top:6px;">
        <span id="platformUrlDisplay">Server: localhost:3000</span>
        <a href="#" id="changeUrlBtn" style="color:#2563eb; text-decoration:underline;">Change</a>
      </div>
    </div>
    <script>
      const btn = document.getElementById("platformSyncBtn");
      const msg = document.getElementById("platformSyncMsg");
      const urlDisplay = document.getElementById("platformUrlDisplay");
      const changeBtn = document.getElementById("changeUrlBtn");

      async function checkConnection() {
        if (typeof chrome === "undefined" || !chrome.storage?.local) return;
        chrome.storage.local.get(["platformUrl", "platformApiKey", "platformWorkspaceId", "platformWorkspaceName"], async (stored) => {
          const base = (stored.platformUrl || "http://localhost:3000").replace(/\/+$/, "");

          // 1. First attempt discovery from active open platform tab
          if (chrome.tabs?.query) {
            try {
              const tabs = await chrome.tabs.query({ url: [`${base}/*`, "http://localhost:3000/*", "https://*.vercel.app/*"] });
              if (tabs && tabs.length > 0 && tabs[0].id) {
                chrome.tabs.sendMessage(tabs[0].id, { type: "GET_ACTIVE_TAB_WORKSPACE" }, (tabResp) => {
                  if (tabResp && tabResp.success && tabResp.workspace) {
                    const ws = tabResp.workspace;
                    chrome.storage.local.set({
                      platformWorkspaceId: ws.workspaceId,
                      platformWorkspaceName: ws.workspaceName,
                      platformApiKey: ws.apiKey,
                      platformUrl: ws.platformUrl || base
                    });
                    urlDisplay.innerHTML = '<span style="color:#059669; font-weight:700;">● Connected:</span> ' + ws.workspaceName;
                  }
                });
              }
            } catch (tabErr) {}
          }

          // 2. Fetch authenticated workspace info from platform API
          const apiKey = stored.platformApiKey || "";
          try {
            const headers = {};
            if (apiKey && !apiKey.startsWith("ewc_live_9a7f")) {
              headers["Authorization"] = "Bearer " + apiKey;
            }

            const res = await fetch(base + "/api/v1/leads/ingest", {
              credentials: "include",
              headers
            });
            const data = await res.json();
            if (data && data.success && data.workspace) {
              const wsName = data.workspace.name || "My Workspace";
              const wsId = data.workspace.id;
              const wsKey = data.workspace.apiKey || apiKey;
              chrome.storage.local.set({
                platformWorkspaceId: wsId,
                platformWorkspaceName: wsName,
                platformApiKey: wsKey
              });
              urlDisplay.innerHTML = '<span style="color:#059669; font-weight:700;">● Connected:</span> ' + wsName;
              return;
            }
          } catch (e) {
            // ignore
          }

          if (stored.platformWorkspaceName) {
            urlDisplay.innerHTML = '<span style="color:#059669; font-weight:700;">●</span> ' + stored.platformWorkspaceName;
          } else {
            urlDisplay.innerText = "Server: " + base.replace(/^https?:\/\//, "");
          }
        });
      }

      checkConnection();

      if (changeBtn) {
        changeBtn.addEventListener("click", (e) => {
          e.preventDefault();
          chrome.storage.local.get(["platformUrl", "platformApiKey"], (res) => {
            const curr = res.platformUrl || "http://localhost:3000";
            const updated = prompt("1. Enter Platform URL:", curr);
            if (updated && updated.trim()) {
              const clean = updated.trim().replace(/\/+$/, "");
              const currKey = res.platformApiKey || "";
              const updatedKey = prompt("2. Enter Workspace API Key (or leave blank to auto-detect):", currKey);
              const saveObj = { platformUrl: clean };
              if (updatedKey !== null) {
                saveObj.platformApiKey = updatedKey.trim();
              }
              chrome.storage.local.set(saveObj, () => {
                checkConnection();
              });
            }
          });
        });
      }

      if (btn) {
        btn.addEventListener("click", () => {
          btn.innerText = "Pushing to Platform...";
          btn.disabled = true;
          try {
            chrome.runtime.sendMessage({ type: "SYNC_TO_PLATFORM" }, (res) => {
              if (res && res.success) {
                msg.innerText = "✅ Synced " + (res.stats ? res.stats.uniqueProcessed : "all") + " leads (" + (res.stats ? res.stats.whatsappEligible : 0) + " WhatsApp)!";
                btn.innerText = "✓ Pushed Successfully!";
              } else {
                msg.innerText = "❌ " + (res && res.error ? res.error : "Failed to connect to platform API");
                btn.innerText = "🚀 Push Leads to Unified Platform";
                btn.disabled = false;
              }
            });
          } catch(e) {
            msg.innerText = "Error: " + e.message;
            btn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
